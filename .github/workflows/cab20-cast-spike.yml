name: CAB-20 signed Cast spike

on:
  push:
    branches: [spike/cab-20-cast-connect]
    paths:
      - .github/workflows/cab20-cast-spike.yml
      - apps/android-tv/**
      - apps/android-phone/**

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: android-tv
            role: tv
            abi: armeabi-v7a
          - app: android-phone
            role: phone
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release spike
        working-directory: apps/${{ matrix.app }}
        env:
          ORG_GRADLE_PROJECT_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          ORG_GRADLE_PROJECT_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew assembleRelease -PCABLEGRAM_CAST_APP_ID=938FB492 -PCABLEGRAM_ABIS=${{ matrix.abi }}
      - name: Sign with existing release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo "Required release signing secrets are missing." >&2
            exit 1
          }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/cab20-release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cab20-release.jks"
          mapfile -t unsigned_apks < <(find apps/${{ matrix.app }}/build/outputs/apk/release -maxdepth 1 -name '*unsigned.apk')
          test "${#unsigned_apks[@]}" -eq 1
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          mkdir -p dist
          output="dist/cablegram-${{ matrix.role }}-cab20-release-key.apk"
          "$signer" sign --ks "$RUNNER_TEMP/cab20-release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "$output" "${unsigned_apks[0]}"
          "$signer" verify --print-certs "$output" > dist/signature.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cab20-signed-${{ matrix.role }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
