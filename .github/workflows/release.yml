name: Release
# Builds both apps from a tagged commit, signs them, and publishes the APKs with SHA-256 checksums and a
# build attestation. See VERIFY.md for how to check a download.
#
# Intended artifacts per app: one APK for each of armeabi-v7a and arm64-v8a (sideload; there is no universal APK)
# and one Play bundle (a run artifact, not attached to the release). The Gradle `splits` block only splits APKs
# when no bundle task is requested, so the APKs and the bundle are built by separate Gradle invocations, and
# scripts/release/ checks that exactly the intended files exist, are signed, and are checksummed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [android-phone, android-tv]
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Each tag gets a higher code, including release candidates. Reruns retain the same code.
          # The offset leaves room above the manually published versions (currently code 4).
          echo "ORG_GRADLE_PROJECT_CABLEGRAM_VERSION_CODE=$((1000 + RELEASE_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_CABLEGRAM_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric needs JDK 21 for SDK 36; the apps still compile to Java 17 bytecode.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the release scripts
        run: scripts/release/test.sh
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew testDebugUnitTest
      - name: Build release APKs (one per ABI)
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew assembleRelease
      - name: Build release bundle
        working-directory: apps/${{ matrix.app }}
        # A separate invocation: with a bundle task in the same build, the ABI splits are switched off.
        run: ./gradlew bundleRelease
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit merged release permissions
        run: node scripts/audit-release-permissions.mjs ${{ matrix.app }}
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is not set; a release must be signed." >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          # Signs every intended APK and the Play bundle with the same key (the upload key), and fails if one is
          # missing, duplicated, unexpected or does not verify.
          KEYSTORE="$RUNNER_TEMP/release.jks" scripts/release/package-artifacts.sh \
            ${{ matrix.app == 'android-phone' && 'phone' || 'tv' }} "$GITHUB_REF_NAME" apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ matrix.app }}
          path: dist-play/*.aab
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apk-*
          merge-multiple: true
      - name: Checksums
        # Fails unless dist holds exactly the intended APKs of both apps; every one gets a verified checksum.
        run: |
          scripts/release/checksums.sh "$GITHUB_REF_NAME" dist
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.3.0-rc1, v0.0.0-test) is a trial: it stays a draft that only maintainers see.
        run: |
          draft=""
          case "$GITHUB_REF_NAME" in *-*) draft="--draft" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS $draft \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  play-internal:
    name: Google Play internal (${{ matrix.app }})
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: android-phone
            package: app.cablegram.phone
          - app: android-tv
            package: app.cablegram
    steps:
      - name: Check Play publishing credential
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Set the PLAY_SERVICE_ACCOUNT_JSON repository Actions secret with testing-track access to both Cablegram apps."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: play-bundle-${{ matrix.app }}
          path: dist-play
      - name: Upload signed bundle to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: dist-play/*.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: completed
