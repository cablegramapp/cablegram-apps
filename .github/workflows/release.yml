name: Release
# Builds both apps from a tagged commit, signs them, and publishes the APKs with SHA-256 checksums and a
# build attestation. See VERIFY.md for how to check a download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [android-phone, android-tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit merged release permissions
        run: node scripts/audit-release-permissions.mjs ${{ matrix.app }}
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is not set; a release must be signed." >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          unsigned=$(ls apps/${{ matrix.app }}/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          mkdir -p dist
          out="dist/cablegram-${{ matrix.app == 'android-phone' && 'phone' || 'tv' }}-${GITHUB_REF_NAME}.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "$out" "$unsigned"
          "$apksigner" verify --print-certs "$out"
          # The app bundle for Google Play is signed with the same key (the upload key). It is not attached to
          # the public release: users cannot install a bundle. Download it from this run's artifacts.
          bundle=$(ls apps/${{ matrix.app }}/build/outputs/bundle/release/*.aab | head -n 1)
          bundle_out="dist-play/cablegram-${{ matrix.app == 'android-phone' && 'phone' || 'tv' }}-${GITHUB_REF_NAME}.aab"
          mkdir -p dist-play
          cp "$bundle" "$bundle_out"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD "$bundle_out" "$KEY_ALIAS"
          jarsigner -verify "$bundle_out"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ matrix.app }}
          path: dist-play/*.aab
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apk-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.3.0-rc1, v0.0.0-test) is a trial: it stays a draft that only maintainers see.
        run: |
          draft=""
          case "$GITHUB_REF_NAME" in *-*) draft="--draft" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS $draft \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
