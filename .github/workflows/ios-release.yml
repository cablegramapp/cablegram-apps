name: iOS release
# Archives the iPhone app from a tagged commit, signs it for the App Store and uploads it to TestFlight (internal testing only;
# App Review and the App Store release stay manual). Same tags as release.yml (Android). A manual run, or a push to the
# ios-release-dry-run branch, builds and signs without uploading (a manual run uploads when `upload` is ticked). Without the
# signing secrets the job skips with a notice, so an Android release still works.
on:
  push:
    tags: ["v*"]
    # Manual runs need this file on main; until then, push a branch with this name to try the signing.
    branches: ["ios-release-dry-run"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight (otherwise only archive and sign)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight (iPhone)
    # Xcode 26, as the ios job in ci.yml.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && secrets.IOS_PROFILE_APP_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_CONTENT != '' }}
    steps:
      - name: Signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::iOS signing secrets are not set (see apps/ios-phone/scripts/setup-ios-signing.sh); skipping the TestFlight build."
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING == 'true'
      - name: Version
        if: env.HAS_SIGNING == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # CFBundleShortVersionString takes digits only: v0.3.0-rc1 ships as 0.3.0. A manual run keeps the version in Base.xcconfig.
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"; version="${version%%-*}"
          else
            version=$(sed -nE 's/^MARKETING_VERSION = (.*)$/\1/p' apps/ios-phone/Config/Base.xcconfig)
          fi
          # Every upload needs a higher build number; reruns of a run keep theirs (TestFlight then refuses the duplicate).
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((1000 + RUN_NUMBER))" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: String Catalog is up to date
        if: env.HAS_SIGNING == 'true'
        run: python3 scripts/localization/android-to-xcstrings.py --check
      - name: Install XcodeGen
        if: env.HAS_SIGNING == 'true'
        run: brew install xcodegen
      - name: Signing
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
          IOS_PROFILE_SERVING_BASE64: ${{ secrets.IOS_PROFILE_SERVING_BASE64 }}
        run: apps/ios-phone/scripts/setup-ios-signing.sh
      - name: Core tests
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/ios-phone
        run: make core-test
      - name: Archive
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/ios-phone
        run: |
          set -euo pipefail
          make project
          xcodebuild -project Cablegram.xcodeproj -scheme Cablegram -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build -archivePath build/Cablegram.xcarchive archive
      - name: Export
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/ios-phone
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/Cablegram.xcarchive -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PLIST" \
            -exportPath build/ipa
          ls -l build/ipa
          # The app and both extensions must carry the distribution signature and their entitlements.
          app=build/Cablegram.xcarchive/Products/Applications/Cablegram.app
          for bundle in "$app" "$app/PlugIns/ShareExtension.appex" "$app/PlugIns/ServingWidget.appex"; do
            codesign --verify --strict "$bundle"
            codesign -dvv "$bundle" 2>&1 | grep -E '^(Identifier|Authority=Apple Distribution|TeamIdentifier)'
          done
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: ios-ipa
          path: apps/ios-phone/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && (github.ref_type == 'tag' || inputs.upload)
        uses: apple-actions/upload-testflight-build@1fc69ca369a60b813eaaa2d936eda22794b52e17 # v5.4.0
        with:
          app-path: apps/ios-phone/build/ipa/Cablegram.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          uses-non-exempt-encryption: "false"
