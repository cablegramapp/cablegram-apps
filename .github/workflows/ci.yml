name: CI
# Paused for pull requests and pushes for now; to be switched back on later. Releases still run the Android
# unit tests (release.yml, on v* tags) and the web remote its own tests (web-remote.yml, on web-v* tags).
# This workflow can still be started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [android-phone, android-tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew testDebugUnitTest

  telegram-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-telegram-sync.mjs

  web-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: apps/web-remote
        run: npm test
      - name: Syntax check
        working-directory: apps/web-remote
        run: for f in src/*.js sw.js config.js; do node --check "$f"; done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
