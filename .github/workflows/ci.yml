name: CI
# The Android unit tests (./gradlew testDebugUnitTest, no secrets needed) run for pull requests that touch the Android
# apps or the release scripts, and on every push to main. Releases run them again (release.yml, on v* tags).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  telegram-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-telegram-sync.mjs

  release-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Release packaging scripts (fixtures, no real key)
        run: scripts/release/test.sh

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Anything but a pull request (push to main, manual run) always runs the Android tests.
        run: |
          android=true
          ios=true
          if [ "$EVENT" = pull_request ]; then
            # Capture first: diff errors must fail the job, and grep -q must not give git SIGPIPE
            # on large PRs (under pipefail that could incorrectly skip the Android tests).
            changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
            if ! grep -qE '^(apps/android-(phone|tv)/|scripts/release/|\.github/workflows/(ci|release)\.yml$)' <<< "$changed_files"; then
              android=false
            fi
            if ! grep -qE '^(apps/ios-phone/|apps/android-phone/src/main/res/|scripts/localization/android-to-xcstrings\.py$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
              ios=false
            fi
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [android-phone, android-tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric needs JDK 21 for SDK 36; the apps still compile to Java 17 bytecode.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the Gradle cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew testDebugUnitTest
      - name: Keep the test report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: String Catalog is up to date
        run: python3 scripts/localization/android-to-xcstrings.py --check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project, build and test
        working-directory: apps/ios-phone
        run: make project test

  web-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: apps/web-remote
        run: npm test
      - name: Syntax check
        working-directory: apps/web-remote
        run: for f in src/*.js sw.js config.js; do node --check "$f"; done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
