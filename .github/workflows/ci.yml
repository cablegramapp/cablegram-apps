name: CI
# The Android unit tests are not run here for now: they take long, and releases run them (release.yml, on v* tags).
# Re-add the `android` job (matrix android-phone, android-tv: ./gradlew testDebugUnitTest) to bring them back.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  telegram-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-telegram-sync.mjs

  web-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: apps/web-remote
        run: npm test
      - name: Syntax check
        working-directory: apps/web-remote
        run: for f in src/*.js sw.js config.js; do node --check "$f"; done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
