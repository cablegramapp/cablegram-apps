name: Cablegram
options:
  bundleIdPrefix: app.cablegram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  CablegramCore:
    path: Packages/CablegramCore
targets:
  Cablegram:
    type: application
    platform: iOS
    sources:
      - path: Cablegram
      - path: Cablegram/Resources/legal
        optional: true
        buildPhase: resources
    dependencies:
      - package: CablegramCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Cablegram.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cablegram/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
    preBuildScripts:
      - name: Copy LICENSE and NOTICE
        script: |
          mkdir -p "${SRCROOT}/Cablegram/Resources/legal"
          cp "${SRCROOT}/../../LICENSE" "${SRCROOT}/../../NOTICE" "${SRCROOT}/Cablegram/Resources/legal/"
        outputFiles:
          - $(SRCROOT)/Cablegram/Resources/legal/LICENSE
          - $(SRCROOT)/Cablegram/Resources/legal/NOTICE
  CablegramTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CablegramTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cablegram.phone.tests
    dependencies:
      - target: Cablegram
schemes:
  Cablegram:
    build:
      targets:
        Cablegram: all
        CablegramTests: [test]
    test:
      targets: [CablegramTests]
