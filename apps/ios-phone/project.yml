name: Cablegram
options:
  bundleIdPrefix: app.cablegram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  CablegramCore:
    path: Packages/CablegramCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.1.0
  # The TDLib version the Android app ships (tdl-coroutines-android 15.0.0 bundles TDLib 1.8.67). A 360 MB binary package.
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    exactVersion: 1.8.67-fa8294b4
targets:
  Cablegram:
    type: application
    platform: iOS
    sources:
      - path: Cablegram
        excludes: ["Resources/legal/**"]
      - path: Cablegram/Resources/legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: CablegramCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: TDLibFramework
        product: TDLibFramework
      - target: ShareExtension
        embed: true
      - target: ServingWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Cablegram.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cablegram/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
    preBuildScripts:
      - name: Copy LICENSE and NOTICE
        script: |
          mkdir -p "${SRCROOT}/Cablegram/Resources/legal"
          cp "${SRCROOT}/../../LICENSE" "${SRCROOT}/../../NOTICE" "${SRCROOT}/Cablegram/Resources/legal/"
        outputFiles:
          - $(SRCROOT)/Cablegram/Resources/legal/LICENSE
          - $(SRCROOT)/Cablegram/Resources/legal/NOTICE
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Cablegram/Shared
      - path: Cablegram/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
  ServingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ServingWidget
      - path: Cablegram/Shared/ServingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).serving
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ServingWidget/Info.plist
        SKIP_INSTALL: YES
  CablegramTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CablegramTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cablegram.phone.tests
    dependencies:
      - target: Cablegram
schemes:
  Cablegram:
    build:
      targets:
        Cablegram: all
        CablegramTests: [test]
    test:
      targets: [CablegramTests]
