openapi: 3.0.3
info:
  title: Cablegram Control Plane API
  version: 0.1.0
  description: >
    Authoritative household state. Does not stream or store video files.
    Phone JWT (scope=phone) or TV JWT (scope=tv) unless noted.
servers:
  - url: https://api.example.invalid
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: OK
  /api/auth/register:
    post:
      security: []
      summary: Create Cablegram account, founding household, default profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                household_name: { type: string }
      responses:
        "201":
          description: User JWT + household
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Access + refresh tokens
  /api/auth/refresh:
    post:
      responses:
        "200":
          description: New access token
  /api/auth/logout:
    post:
      responses:
        "204":
          description: Revoke refresh
  /api/auth/device:
    post:
      summary: TV starts pairing (no user JWT)
      security: []
      responses:
        "201":
          description: pairing session id, PIN (once), pairing token, expires
  /api/auth/device/{sessionId}:
    get:
      security: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          description: Pairing <token>
          schema: { type: string }
      responses:
        "200":
          description: pending or paired (TV JWT when paired)
  /api/auth/device/claim:
    post:
      summary: Phone claims PIN into household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: "^[0-9]{6}$" }
                tv_display_name: { type: string }
      responses:
        "200":
          description: Pairing completed
  /api/households/invites:
    post:
      summary: Household member invites another Cablegram account (or email) to join
      responses:
        "201":
          description: Invite created (short-lived token; not a pairing PIN)
  /api/households/invites/accept:
    post:
      summary: Signed-in user accepts an invite and becomes a household member
      responses:
        "200":
          description: Membership granted
  /api/me:
    get:
      responses:
        "200":
          description: >
            User, household, devices, membership. Each TV also has `online` (boolean): true while it has Cablegram
            open and takes remote commands (an open command socket, or a command poll in the last 15 s). A phone sends
            "Play on TV" to the TV that is on when the selected one isn't and exactly one other is; older control
            planes omit the field.
            `profile_languages` lists each household profile's effective `ui_language` (`[{id, ui_language}]`); TVs
            read it during their session check. Control planes before migration 046 omit it.
  /api/account/delete:
    post:
      summary: Phone deletes the signed-in account and all its data (Google Play account deletion)
      description: >
        Phone scope only; a TV token gets 403. Requires the account password, checked like a sign-in and
        sharing its 15-minute lock. Everything is deleted at once (account, household, profiles, paired
        devices, library, watch progress, My List, Telegram link, stored files) and it cannot be undone.
        Videos in the user's own Telegram channel belong to their Telegram account and are not touched.
        The same deletion is offered on the public web page `GET /delete-account`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1 }
      responses:
        "204":
          description: Account and data deleted
        "401":
          description: >
            `{"error":"invalid_credentials"}` wrong password (nothing deleted), or
            `{"error":"unauthorized"}` the session is no longer valid
        "403":
          description: Not a phone token
        "429":
          description: '`{"error":"too_many_login_attempts"}` locked for 15 minutes'
  /api/playback/private-approvals:
    post:
      summary: TV requests or phone consumes one-time private playback approval
      description: >
        Bound to household, profile, TV, item/source, and attempt. Consumed once.
        Pairing PIN MUST NOT be accepted as the approval credential.
      responses:
        "200":
          description: Pending, approved (one-time token), consumed, or denied
  /api/profiles:
    get:
      responses:
        "200":
          description: Profiles including pin_set boolean (not pin) and effective ui_language (BCP 47 tag), plus nullable ui_language_override
    post:
      summary: Create profile (optional PIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses:
        "201":
          description: Created
  /api/me/language:
    put:
      summary: Save the signed-in phone user's device language
      description: >
        Phone only. The account owner's language is inherited by profiles without an
        explicit override. Other accounts paired to the same TV are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ui_language]
              properties:
                ui_language: { type: string, minLength: 2, maxLength: 64, description: Valid BCP 47 language tag }
      responses:
        "200":
          description: Canonical ui_language tag saved
        "403":
          description: TV credentials cannot change language preferences
  /api/profiles/{profileId}/language:
    patch:
      summary: Set a profile language or reset it to follow the account owner's phone
      description: Phone only; the profile must belong to the authenticated household.
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ui_language]
              properties:
                ui_language: { type: string, nullable: true, minLength: 2, maxLength: 64 }
      responses:
        "200":
          description: Override saved; null restores inheritance
        "404":
          description: Profile absent from the authenticated household
  /api/household:
    patch:
      summary: Rename the account and/or set the profile lock
      description: >
        `profile_lock` (phone only, off by default): TVs wait for a phone to allow a profile
        before opening it. `GET /api/me` reports it as `household.profile_lock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                profile_lock: { type: boolean }
      responses:
        "200":
          description: '`{"household":{...,"profile_lock":bool}}`'
        "403":
          description: profile_lock sent with a TV token
  /api/profiles/switch-requests:
    post:
      summary: TV asks to open a profile
      description: >
        Body `{"profileId","deviceName"}`. Answers 202 `{"requestId","status","profileName"}`. `status` is
        `pending` when the lock is on and the profile has no PIN (a PIN has priority: the TV asks for it
        instead), otherwise `approved`. A new request from the same TV ends its previous pending one.
        A pending request expires after 2 minutes.
  /api/profiles/switch-requests/pending:
    get:
      summary: Phone lists requests waiting for an answer
      responses:
        "200":
          description: '`{"items":[{"request_id","profile_id","profile_name","tv_name","expires_at"}]}`'
  /api/profiles/switch-requests/{requestId}:
    get:
      summary: TV polls its request
      responses:
        "200":
          description: '`{"requestId","status","expiresAt","profileName"}`; status pending, approved, denied or expired'
  /api/profiles/switch-requests/{requestId}/approve:
    post:
      summary: Phone allows the profile (also /deny to refuse)
      responses:
        "200":
          description: Answered
        "409":
          description: '`switch_request_not_pending`: already answered, withdrawn or expired'
  /api/profiles/switch-requests/{requestId}/cancel:
    post:
      summary: The TV that asked stops waiting
  /api/devices/{deviceId}:
    patch:
      summary: Phone updates LAN reachability hint (not catalog)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lan_host: { type: string }
                lan_port: { type: integer }
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Rename a TV. Phone-scope tokens only; a TV cannot rename itself.
      responses:
        "200":
          description: Updated
    delete:
      summary: Revoke device
      responses:
        "204":
          description: Revoked
  /api/catalog/items:
    get:
      summary: Household logical library (TV and phone)
      responses:
        "200":
          description: items with sources metadata and progress for selected profile
    post:
      summary: Phone import — create item + phone_local source
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBody"
      responses:
        "201":
          description: Item created
  /api/catalog/items/{itemId}:
    patch:
      summary: Correct title match; never overwrites origin_filename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                year: { type: integer }
                description: { type: string }
                duration_seconds: { type: number }
      responses:
        "200":
          description: Updated
  /api/catalog/items/{itemId}/poster:
    put:
      summary: Upload poster image bytes (not video)
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Poster stored/referenced
  /api/profiles/{profileId}/progress/{itemId}:
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressBody"
      responses:
        "200":
          description: Upserted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  security:
    - bearerAuth: []
  schemas:
    ImportBody:
      type: object
      required: [origin_filename, origin_identity]
      properties:
        origin_filename: { type: string }
        origin_identity: { type: string }
        title: { type: string }
        duration_seconds: { type: number }
        serving_device_id: { type: string, format: uuid }
    ProgressBody:
      type: object
      required: [position_seconds, state]
      properties:
        position_seconds: { type: number }
        duration_seconds: { type: number }
        state:
          type: string
          enum: [playing, paused, stopped, completed]
        client_updated_at: { type: string, format: date-time }
