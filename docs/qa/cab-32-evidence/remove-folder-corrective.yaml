appId: app.cablegram.phone.cab32
---
# Precondition: confirmation dialog remains open from the initial failed selector run.
- tapOn: Remove folder
- assertVisible: CAB32Folder
- assertNotVisible: '^CAB32SecondFolder$'
- stopApp
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element: CAB32Folder
    timeout: 10000
- assertNotVisible: '^CAB32SecondFolder$'
- tapOn: CAB32Folder
- assertVisible: Nested
- tapOn: Nested
- assertVisible: FolderClip.mp4
