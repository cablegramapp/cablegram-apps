appId: app.cablegram.phone.cab32
---
# Precondition: three remembered test folders, including CAB32SecondFolder.
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element: CAB32SecondFolder
    timeout: 10000
- tapOn: Remove folder CAB32SecondFolder
- tapOn:
    id: browse_remove_folder_confirm
- assertVisible: CAB32Folder
- assertNotVisible: '^CAB32SecondFolder$'
- stopApp
- launchApp
- tapOn:
    id: nav_browse
- scrollUntilVisible:
    element: CAB32Folder
    timeout: 10000
- assertNotVisible: '^CAB32SecondFolder$'
- tapOn: CAB32Folder
- assertVisible: Nested
- tapOn: Nested
- assertVisible: FolderClip.mp4
